name: Build DB PATCH

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-patch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix site
      - name: Test
        run: npm --prefix site test
      - name: Build and verify production output
        run: npm --prefix site run build
      - uses: actions/upload-artifact@v4
        with:
          name: db-patch-site
          path: site/dist/
          if-no-files-found: error
          retention-days: 14
